<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Collocations · Speak Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Non-blocking font: the page paints straight away with the fallback font, even on slow or no internet -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" /></noscript>
  <style>
    /* Same tokens and building blocks as index.html */
    :root {
      --bg: #ffffff;
      --soft: #f7f7f5;
      --ink: #141414;
      --muted: #5f6368;
      --faint: #9a9a9a;
      --line: #e6e6e3;
      --line-strong: #d4d4d0;
      --yellow: #ffcf3a;
      --green: #20b25a;
      --accent: #141414;
      --tint: #f2f2ef;
      --press: 3px;
      --font: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: var(--font); background: var(--bg); color: var(--ink);
      font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent; min-height: 100dvh;
    }
    button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; padding: 0; }
    :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; border-radius: 12px; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      height: 40px; padding: 0 14px; border-radius: 12px; font-weight: 700; font-size: .9rem;
      background: #fff; border: 2px solid var(--line-strong); box-shadow: 0 var(--press) 0 var(--line-strong);
      color: var(--ink); text-decoration: none; transition: transform .08s ease, box-shadow .08s ease; user-select: none;
    }
    .btn:active { transform: translateY(var(--press)); box-shadow: 0 0 0 var(--line-strong); }
    .btn svg { width: 20px; height: 20px; flex: none; }
    .btn-icon { width: 40px; padding: 0; }

    .topbar {
      position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.92);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-bottom: 2px solid var(--line); padding-top: env(safe-area-inset-top);
    }
    .topbar-inner { max-width: 720px; margin: 0 auto; height: 60px; padding: 0 16px; display: flex; align-items: center; gap: 12px; }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.15rem; letter-spacing: -.02em; }
    .logo-mark { width: 32px; height: 32px; border-radius: 10px; background: var(--ink); display: grid; place-items: center; }
    .logo-mark span { width: 12px; height: 12px; border-radius: 50%; background: var(--yellow); box-shadow: 8px 6px 0 -2px var(--green); }

    .app { max-width: 720px; margin: 0 auto; padding: 0 16px calc(40px + env(safe-area-inset-bottom)); }
    .intro { padding: 24px 0 8px; }
    .intro h1 { font-size: clamp(1.6rem, 6vw, 2.2rem); line-height: 1.15; font-weight: 800; letter-spacing: -.03em; margin: 0; }
    .intro p { margin: 6px 0 0; color: var(--muted); }

    /* Filter + search stay reachable while scrolling */
    .controls { position: sticky; top: calc(62px + env(safe-area-inset-top)); z-index: 10; background: #fff; padding: 12px 0 10px; margin: 0 -16px; padding-inline: 16px; border-bottom: 2px solid var(--line); }
    .areas { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-bottom: 10px; }
    .area-btn {
      min-width: 0; height: 42px; padding: 0 4px; border-radius: 12px; font-weight: 700; font-size: .9rem; white-space: nowrap;
      border: 2px solid var(--line); background: #fff; color: var(--muted); transition: background .15s, color .15s, border-color .15s;
    }
    .area-btn:hover { border-color: var(--line-strong); }
    .area-btn[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
    .searchfield { position: relative; }
    .searchfield svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--faint); pointer-events: none; }
    .search {
      width: 100%; height: 48px; padding: 0 14px 0 42px; font: inherit; font-size: 16px; font-weight: 600;
      border: 2px solid var(--line); border-radius: 14px; background: var(--soft); color: var(--ink); -webkit-appearance: none; appearance: none;
    }
    .search:focus { outline: none; border-color: var(--ink); background: #fff; }
    .result-count { font-size: .8rem; font-weight: 600; color: var(--faint); margin: 8px 2px 0; }

    /* Groups */
    .group { margin-top: 22px; }
    .group-head { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; }
    .group-head h2 { margin: 0; font-size: 1.1rem; font-weight: 800; letter-spacing: -.01em; }
    .area-badge { font-size: .72rem; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: var(--tint); color: var(--accent); }
    .area-everyday { --accent: #2f6bff; --tint: #eaf1ff; }
    .area-software { --accent: #7b4dff; --tint: #f1ebff; }
    .items { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    .item { border: 2px solid var(--line); border-left: 6px solid var(--accent); border-radius: 14px; padding: 12px 14px; }
    .phrase { margin: 0; font-weight: 800; font-size: 1.02rem; letter-spacing: -.01em; }
    .meaning { margin: 2px 0 0; color: var(--muted); font-size: .9rem; font-weight: 500; }
    .example { margin: 8px 0 0; font-size: .95rem; line-height: 1.55; }
    .example .hl { background: var(--tint); color: inherit; font-weight: 700; border-bottom: 2px solid var(--accent); border-radius: 3px; padding: 0 2px; }
    .item mark.q { background: #ffe58a; color: inherit; border-radius: 3px; padding: 0 1px; }
    .empty { text-align: center; color: var(--muted); padding: 40px 0; font-weight: 600; }

    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="btn btn-icon" href="index.html" aria-label="Back to questions">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </a>
      <div class="logo"><span class="logo-mark" aria-hidden="true"><span></span></span>Speak Up</div>
    </div>
  </header>

  <div class="app">
    <section class="intro">
      <h1>Useful collocations</h1>
      <p>Words that naturally go together, for everyday English and software work.</p>
    </section>

    <div class="controls">
      <div class="areas" id="areas" role="group" aria-label="Area">
        <button class="area-btn" data-area="all" aria-pressed="true">All</button>
        <button class="area-btn" data-area="everyday" aria-pressed="false">Everyday</button>
        <button class="area-btn" data-area="software" aria-pressed="false">Software</button>
      </div>
      <div class="searchfield">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <label class="sr-only" for="search">Search collocations</label>
        <input class="search" id="search" type="search" placeholder="Search collocations" autocomplete="off" enterkeyhint="search" />
      </div>
      <p class="result-count" id="result-count" aria-live="polite"></p>
    </div>

    <main id="list"></main>
  </div>

  <script src="./collocations.js"></script>
</body>
</html>

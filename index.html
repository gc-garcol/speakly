<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Speak Up · IELTS Speaking Practice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Non-blocking font: the page paints straight away with the fallback font, even on slow or no internet -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" /></noscript>
  <style>
    /* ---------- Tokens (Brilliant-inspired: white, bold ink, chunky 3D buttons) ---------- */
    :root {
      --bg: #ffffff;
      --soft: #f7f7f5;
      --ink: #141414;
      --muted: #5f6368;
      --faint: #9a9a9a;
      --line: #e6e6e3;
      --line-strong: #d4d4d0;
      --green: #20b25a;
      --green-dark: #168a44;
      --yellow: #ffcf3a;
      --yellow-dark: #e0a800;
      --accent: #2f6bff;  /* overridden per topic */
      --tint: #eaf1ff;    /* overridden per topic */
      --radius: 20px;
      --press: 4px;
      --bar-h: 80px;
      --font: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: var(--font); background: var(--bg); color: var(--ink);
      font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent; min-height: 100dvh;
    }
    button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; padding: 0; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 12px; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

    /* ---------- Chunky 3D buttons ---------- */
    .btn {
      --face: #fff; --edge: var(--line-strong); --border: var(--line-strong);
      position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      height: 52px; padding: 0 18px; border-radius: 16px; font-weight: 700; font-size: 1rem;
      background: var(--face); border: 2px solid var(--border);
      box-shadow: 0 var(--press) 0 var(--edge);
      transition: transform .08s ease, box-shadow .08s ease, background .2s;
      user-select: none;
    }
    .btn:active:not(:disabled) { transform: translateY(var(--press)); box-shadow: 0 0 0 var(--edge); }
    .btn:disabled { opacity: .45; cursor: default; }
    .btn svg { width: 20px; height: 20px; flex: none; }
    .btn-dark { --face: var(--ink); --edge: #000; --border: var(--ink); color: #fff; }
    .btn-yellow { --face: var(--yellow); --edge: var(--yellow-dark); --border: var(--yellow-dark); }
    .btn-green { --face: var(--green); --edge: var(--green-dark); --border: var(--green-dark); color: #fff; }
    .btn-sm { height: 40px; padding: 0 14px; border-radius: 12px; font-size: .9rem; --press: 3px; }
    .btn-icon { width: 52px; padding: 0; }
    .btn-icon.btn-sm { width: 40px; }

    /* ---------- Top bar ---------- */
    .topbar {
      position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.92);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-bottom: 2px solid var(--line); padding-top: env(safe-area-inset-top);
    }
    .topbar-inner { max-width: 720px; margin: 0 auto; height: 60px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.15rem; letter-spacing: -.02em; }
    .logo-mark { width: 32px; height: 32px; border-radius: 10px; background: var(--ink); display: grid; place-items: center; }
    .logo-mark span { width: 12px; height: 12px; border-radius: 50%; background: var(--yellow); box-shadow: 8px 6px 0 -2px var(--green); }
    .progress-pill {
      display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: .9rem;
      padding: 6px 12px; border: 2px solid var(--line); border-radius: 999px;
    }
    .progress-pill .dot { width: 18px; height: 18px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; font-size: .7rem; }
    .progress-pill.bump { animation: bump .5s ease; }
    @keyframes bump { 40% { transform: scale(1.15); } }

    /* ---------- Layout ---------- */
    /* Extra bottom space so the floating mic button never covers the last row of the card */
    .app { max-width: 720px; margin: 0 auto; padding: 0 16px calc(var(--bar-h) + 92px + env(safe-area-inset-bottom)); }
    .intro { padding: 24px 0 14px; }
    .intro h1 { font-size: clamp(1.6rem, 6vw, 2.2rem); line-height: 1.15; font-weight: 800; letter-spacing: -.03em; margin: 0; }
    .intro p { margin: 6px 0 0; color: var(--muted); font-size: 1rem; }
    .intro-link {
      display: inline-flex; align-items: center; gap: 4px; margin-top: 12px; padding: 6px 10px 6px 12px;
      border: 2px solid var(--line); border-radius: 999px; color: var(--ink); font-weight: 700; font-size: .9rem; text-decoration: none;
    }
    .intro-link:hover { border-color: var(--line-strong); }
    .intro-link svg { width: 16px; height: 16px; }
    .section-label { font-size: .78rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin: 14px 0 10px; }

    /* ---------- Topic tiles ---------- */
    .tiles {
      display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none;
      margin: 0 -16px; padding: 2px 16px 10px; scroll-snap-type: x proximity; scroll-padding-inline: 16px;
    }
    .tiles::-webkit-scrollbar { display: none; }
    .tile {
      flex: none; width: 148px; scroll-snap-align: start; text-align: left;
      background: var(--tile-tint); border: 2px solid transparent; border-radius: 18px;
      padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 8px;
      transition: transform .15s ease, border-color .15s, box-shadow .15s;
    }
    .tile:hover { transform: translateY(-2px); }
    .tile[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 4px 0 var(--ink); transform: translateY(-2px); }
    .tile-name { font-weight: 800; font-size: .95rem; line-height: 1.2; letter-spacing: -.01em; min-height: 2.4em; }
    .tile-meta { font-size: .78rem; font-weight: 600; color: var(--muted); }
    .bar-track { height: 6px; border-radius: 99px; background: rgba(0,0,0,.08); overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 99px; background: var(--tile-accent); transition: width .5s ease; }

    /* ---------- Part pills ---------- */
    .parts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin: 6px 0 18px; }
    .part-btn {
      min-width: 0; height: 42px; padding: 0 4px; border-radius: 12px; font-weight: 700; font-size: .9rem; white-space: nowrap;
      border: 2px solid var(--line); background: #fff; color: var(--muted);
      transition: background .15s, color .15s, border-color .15s;
    }
    .part-btn:hover { border-color: var(--line-strong); }
    .part-btn[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }

    /* ---------- Question card ---------- */
    .card {
      border: 2px solid var(--line); border-radius: 24px; background: #fff; overflow: hidden;
      box-shadow: 0 4px 0 var(--line);
    }
    .card.enter { animation: slide .4s cubic-bezier(.2,.8,.2,1); }
    .card.enter-back { animation: slide-back .4s cubic-bezier(.2,.8,.2,1); }
    @keyframes slide { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
    @keyframes slide-back { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }
    .card-hero { background: var(--tint); padding: 18px 20px 22px; }
    @media (min-width: 640px) { .card-hero { padding: 26px 32px 30px; } .card-body { padding: 4px 32px 26px !important; } }
    .card-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
    .badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .badge { font-size: .78rem; font-weight: 800; padding: 4px 10px; border-radius: 999px; background: #fff; color: var(--ink); }
    .badge-part { background: var(--accent); color: #fff; }
    .badge-done { background: var(--green); color: #fff; }
    .question { font-size: clamp(1.45rem, 5.6vw, 2rem); line-height: 1.2; font-weight: 800; letter-spacing: -.025em; margin: 0; }
    .card-body { padding: 4px 20px 20px; }

    .cues-label { font-weight: 700; color: var(--muted); margin: 18px 0 8px; font-size: .92rem; }
    .cues { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    .cues li { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 2px solid var(--line); border-radius: 14px; font-weight: 600; font-size: .95rem; }
    .cues li span { flex: none; width: 22px; height: 22px; border-radius: 7px; background: var(--tint); color: var(--accent); display: grid; place-items: center; font-size: .75rem; font-weight: 800; margin-top: 1px; }

    /* Timer */
    .timer { display: flex; align-items: center; gap: 14px; margin-top: 16px; padding: 12px 14px; border-radius: 16px; background: var(--soft); }
    .ring { width: 48px; height: 48px; flex: none; }
    .ring svg { transform: rotate(-90deg); width: 100%; height: 100%; }
    .ring circle { fill: none; stroke-width: 5; }
    .ring .track { stroke: var(--line); }
    .ring .prog { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
    .timer.prep .ring .prog { stroke: var(--yellow-dark); }
    .timer.done .ring .prog { stroke: var(--green); }
    .timer-info { flex: 1; min-width: 0; }
    .timer-time { font-size: 1.35rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .timer-label { font-size: .82rem; color: var(--muted); font-weight: 500; }

    /* Hint steps */
    .step { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows .45s ease, opacity .35s ease, margin .45s ease; }
    .step > div { overflow: hidden; }
    .step.show { grid-template-rows: 1fr; opacity: 1; margin-top: 16px; }
    .panel { border-radius: 18px; padding: 16px; }
    .panel-ideas { background: #fff8e1; border: 2px solid #ffe7a3; }
    .panel-sample { border: 2px solid var(--line); }
    .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
    .panel-title { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: .95rem; }
    .panel-title .em { font-size: 1.1rem; }
    /* PEEL colours: Point · Explanation · Example · Link */
    .peel-point { --peel: #2f6bff; --peel-bg: #eaf1ff; }
    .peel-explanation { --peel: #7b4dff; --peel-bg: #f1ebff; }
    .peel-example { --peel: #e0731f; --peel-bg: #fff0e6; }
    .peel-link { --peel: #168a44; --peel-bg: #e4f6ea; }
    .structure { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
    .structure li { display: flex; align-items: flex-start; gap: 10px; background: #fff; border: 2px solid #ffe7a3; padding: 10px; border-radius: 12px; font-size: .9rem; }
    .structure li > b { margin-top: 1px; }
    .peel-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .peel-body strong { color: var(--peel); font-size: .78rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }
    .peel-idea { color: var(--ink); font-weight: 600; line-height: 1.4; }
    .peel-vocab { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .peel-vocab span { background: var(--peel-bg); color: var(--ink); font-size: .84rem; font-weight: 600; padding: 3px 9px; border-radius: 8px; }
    .structure b, .peel-tag b {
      flex: none; width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center;
      background: var(--peel); color: #fff; font-size: .8rem; font-weight: 800;
    }
    .peel-row { border-left: 4px solid var(--peel); padding: 2px 0 2px 12px; }
    .peel-row + .peel-row { margin-top: 14px; }
    .peel-tag { display: inline-flex; align-items: center; gap: 8px; font-size: .78rem; font-weight: 800; color: var(--peel); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
    .peel-tag b { width: 20px; height: 20px; border-radius: 6px; font-size: .72rem; }
    .sample p { margin: 0; font-size: 1.02rem; line-height: 1.65; }
    .sample .phrase { background: var(--peel-bg); color: inherit; font-weight: 700; border-bottom: 2px solid var(--peel); border-radius: 3px; padding: 0 2px; }
    .tip { font-size: .85rem; color: var(--muted); margin: 12px 0 0; }

    .btn-done { width: 100%; margin-top: 20px; height: 48px; }
    .card-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 16px; padding-top: 16px; border-top: 2px solid var(--line); }
    .card-foot .btn-icon { width: 52px; height: 44px; }
    .card-foot svg { width: 22px; height: 22px; }
    .counter { font-weight: 800; font-size: .95rem; color: var(--muted); font-variant-numeric: tabular-nums; }
    .btn-done[aria-pressed="true"] { --face: var(--green); --edge: var(--green-dark); --border: var(--green-dark); color: #fff; }

    /* Live transcript of the learner's spoken answer (Web Speech API) */
    .speech { margin-top: 16px; border: 2px dashed var(--line-strong); border-radius: 18px; padding: 12px 14px 14px; }
    .speech.live { border-style: solid; border-color: var(--accent); }
    .speech-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .speech-title { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: .95rem; }
    .speech-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--faint); flex: none; }
    .speech.live .speech-dot { background: #e5484d; animation: blink 1s ease-in-out infinite alternate; }
    @keyframes blink { to { opacity: .3; } }
    .speech-count { font-size: .8rem; font-weight: 700; color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .speech-text { margin: 0; font-size: 1.02rem; line-height: 1.6; overflow-wrap: anywhere; }
    .speech-text .interim { color: var(--faint); }
    .speech-text .placeholder { color: var(--muted); font-weight: 500; }

    /* Floating mic button, sits above the bottom bar on the right */
    .mic-fab {
      position: fixed; z-index: 25; width: 60px; height: 60px; border-radius: 50%;
      right: max(16px, calc((100vw - 688px) / 2));
      bottom: calc(var(--bar-h) + 16px + env(safe-area-inset-bottom));
      --face: var(--ink); --edge: #000; --border: var(--ink); color: #fff; padding: 0;
    }
    .mic-fab svg { width: 26px; height: 26px; }
    .mic-fab[aria-pressed="true"] { --face: #e5484d; --edge: #b4232a; --border: #b4232a; }
    .mic-fab[aria-pressed="true"]::after {
      content: ""; position: absolute; inset: -8px; border-radius: 50%; border: 3px solid #e5484d;
      animation: ripple 1.4s ease-out infinite; pointer-events: none;
    }
    @keyframes ripple { from { transform: scale(.85); opacity: .8; } to { transform: scale(1.25); opacity: 0; } }
    .mic-fab[hidden] { display: none; }

    .empty { text-align: center; padding: 44px 20px; }
    .empty .big { font-size: 2.6rem; }
    .empty h2 { margin: 8px 0 4px; font-weight: 800; }
    .empty p { color: var(--muted); margin: 0; }

    /* Toast */
    .toast {
      position: fixed; left: 50%; bottom: calc(var(--bar-h) + 20px + env(safe-area-inset-bottom)); z-index: 30;
      transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
      background: var(--ink); color: #fff; font-weight: 700; padding: 12px 18px; border-radius: 14px;
      transition: transform .3s cubic-bezier(.2,.8,.2,1), opacity .3s; white-space: nowrap; font-size: .92rem;
    }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }

    /* ---------- Bottom action bar ---------- */
    .actionbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: #fff;
      border-top: 2px solid var(--line); padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
    }
    .actionbar-inner { max-width: 688px; margin: 0 auto; display: flex; gap: 10px; }
    .actionbar .grow { flex: 1; }
    .actionbar .grow-2 { flex: 1.35; }
    kbd { font-family: inherit; font-size: .72rem; opacity: .55; display: none; }
    @media (hover: hover) and (min-width: 700px) { kbd { display: inline; } }

    /* ---------- Search sheet ---------- */
    dialog {
      border: 2px solid var(--line); padding: 0; width: 100%; max-width: 720px; max-height: 88dvh;
      margin: auto auto 0; border-radius: 24px 24px 0 0; background: #fff; color: var(--ink); flex-direction: column;
    }
    dialog[open] { display: flex; animation: up .35s cubic-bezier(.2,.8,.2,1); }
    dialog::backdrop { background: rgba(20,20,20,.4); }
    @keyframes up { from { transform: translateY(100%); } to { transform: none; } }
    @media (min-width: 700px) { dialog { margin: 8dvh auto auto; border-radius: 24px; max-height: 80dvh; box-shadow: 0 6px 0 var(--line); } }
    .sheet-head { padding: 16px 16px 10px; border-bottom: 2px solid var(--line); }
    .sheet-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .sheet-top h2 { margin: 0; font-size: 1.3rem; font-weight: 800; letter-spacing: -.02em; }
    .searchfield { position: relative; }
    .searchfield svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--faint); pointer-events: none; }
    .search {
      width: 100%; height: 48px; padding: 0 14px 0 42px; font: inherit; font-size: 16px; font-weight: 600;
      border: 2px solid var(--line); border-radius: 14px; background: var(--soft); color: var(--ink); -webkit-appearance: none; appearance: none;
    }
    .search:focus { outline: none; border-color: var(--ink); background: #fff; }
    .result-count { font-size: .8rem; font-weight: 600; color: var(--faint); margin: 8px 2px 0; }
    .results { list-style: none; margin: 0; padding: 0 16px 24px; overflow-y: auto; flex: 1; overscroll-behavior: contain; }
    .group-title { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: .85rem; padding: 18px 2px 8px; position: sticky; top: 0; background: #fff; z-index: 1; }
    .results li + li:not(.group-title) { margin-top: 8px; }
    .results button {
      width: 100%; text-align: left; padding: 12px 12px; display: flex; gap: 10px; align-items: flex-start;
      border: 2px solid var(--line); border-radius: 14px; line-height: 1.35; font-weight: 600; font-size: .95rem;
      transition: border-color .15s, background .15s;
    }
    .results button:hover { border-color: var(--line-strong); background: var(--soft); }
    .results button[aria-current="true"] { border-color: var(--ink); }
    .p-badge { flex: none; font-size: .7rem; font-weight: 800; padding: 3px 7px; border-radius: 7px; background: var(--tint); color: var(--accent); margin-top: 1px; }
    .q-text { flex: 1; }
    .q-check { flex: none; color: var(--green); font-weight: 800; }
    .results mark { background: #ffe58a; color: inherit; border-radius: 3px; padding: 0 1px; }
    .no-results { text-align: center; color: var(--muted); padding: 40px 0; font-weight: 600; }

    /* ---------- Loading skeleton (static markup, replaced once the data files have loaded) ---------- */
    .skel {
      display: block; color: transparent; background: var(--line); border-radius: 8px;
      animation: pulse 1.1s ease-in-out infinite alternate; user-select: none;
    }
    @keyframes pulse { to { opacity: .45; } }
    .skel-inline { display: inline-block; width: 44px; border-radius: 999px; }
    .tile-skel { --tile-tint: var(--soft); cursor: default; }
    .tile-skel:hover { transform: none; }
    .tile-skel .tile-name { display: flex; flex-direction: column; gap: 6px; }
    .skel-line { height: .9em; width: 100%; }
    .skel-line.short { width: 60%; }
    .skel-card .card-hero { background: var(--soft); }
    .skel-card .badges .skel { width: 64px; height: 26px; border-radius: 999px; }
    .skel-card .question { display: flex; flex-direction: column; gap: 10px; }
    .skel-card .question .skel { height: .8em; }
    .skel-card .skel-btn { height: 48px; margin-top: 20px; border-radius: 16px; }
    .skel-card .card-foot .skel { width: 52px; height: 40px; border-radius: 12px; }
    .skel-card .card-foot .skel-inline { width: 48px; height: 1em; }

    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo"><span class="logo-mark" aria-hidden="true"><span></span></span>Speak Up</div>
      <div class="progress-pill" id="progress-pill" aria-live="polite"><span class="skel skel-inline" aria-hidden="true">&nbsp;</span></div>
    </div>
  </header>

  <div class="app" id="app" aria-busy="true">
    <section class="intro">
      <h1>Practise IELTS Speaking, one question at a time.</h1>
      <a class="intro-link" href="collocations.html">Useful collocations
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </a>
    </section>

    <p class="section-label" id="topics-label">Topics</p>
    <nav class="tiles" id="tiles" aria-labelledby="topics-label">
      <div class="tile tile-skel" aria-hidden="true"><span class="tile-name"><span class="skel skel-line"></span><span class="skel skel-line short"></span></span><span class="bar-track"></span><span class="tile-meta"><span class="skel skel-inline">&nbsp;</span></span></div>
      <div class="tile tile-skel" aria-hidden="true"><span class="tile-name"><span class="skel skel-line"></span><span class="skel skel-line short"></span></span><span class="bar-track"></span><span class="tile-meta"><span class="skel skel-inline">&nbsp;</span></span></div>
      <div class="tile tile-skel" aria-hidden="true"><span class="tile-name"><span class="skel skel-line"></span><span class="skel skel-line short"></span></span><span class="bar-track"></span><span class="tile-meta"><span class="skel skel-inline">&nbsp;</span></span></div>
      <div class="tile tile-skel" aria-hidden="true"><span class="tile-name"><span class="skel skel-line"></span><span class="skel skel-line short"></span></span><span class="bar-track"></span><span class="tile-meta"><span class="skel skel-inline">&nbsp;</span></span></div>
      <div class="tile tile-skel" aria-hidden="true"><span class="tile-name"><span class="skel skel-line"></span><span class="skel skel-line short"></span></span><span class="bar-track"></span><span class="tile-meta"><span class="skel skel-inline">&nbsp;</span></span></div>
    </nav>

    <div class="parts" id="parts" role="group" aria-label="IELTS part">
      <button class="part-btn" data-part="0" aria-pressed="true">All</button>
      <button class="part-btn" data-part="1" aria-pressed="false">Part 1</button>
      <button class="part-btn" data-part="2" aria-pressed="false">Part 2</button>
      <button class="part-btn" data-part="3" aria-pressed="false">Part 3</button>
    </div>

    <main id="main">
      <p class="sr-only" role="status">Loading questions…</p>
      <div class="card skel-card" aria-hidden="true">
        <div class="card-hero">
          <div class="card-top"><div class="badges"><span class="skel"></span><span class="skel"></span></div></div>
          <div class="question"><span class="skel"></span><span class="skel" style="width:85%"></span><span class="skel" style="width:50%"></span></div>
        </div>
        <div class="card-body">
          <span class="skel skel-btn"></span>
          <div class="card-foot"><span class="skel"></span><span class="skel skel-inline">&nbsp;</span><span class="skel"></span></div>
        </div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Shown by index.js only when the browser supports speech recognition -->
  <button class="btn mic-fab" id="btn-mic" aria-pressed="false" aria-label="Start speaking" hidden disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
  </button>

  <div class="actionbar">
    <div class="actionbar-inner">
      <button class="btn btn-icon" id="btn-search" aria-label="Find a question" aria-haspopup="dialog" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
      <button class="btn btn-yellow grow" id="btn-hint" aria-controls="steps" disabled>
        <span id="hint-label">Hint</span> <kbd>H</kbd>
      </button>
      <button class="btn btn-dark grow-2" id="btn-random" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
        Random <kbd>R</kbd>
      </button>
    </div>
  </div>

  <dialog id="sheet" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <div class="sheet-top">
        <h2 id="sheet-title">Find a question</h2>
        <button class="btn btn-sm btn-icon" id="btn-close" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="searchfield">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <label class="sr-only" for="search">Search questions</label>
        <input class="search" id="search" type="search" placeholder="Search questions or topics" autocomplete="off" enterkeyhint="search" />
      </div>
      <p class="result-count" id="result-count" aria-live="polite"></p>
    </div>
    <ul class="results" id="results"></ul>
  </dialog>

  <script src="./index.js"></script>
</body>
</html>
